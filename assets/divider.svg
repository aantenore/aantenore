<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 36" width="860" height="36" role="img" aria-labelledby="t">
<title id="t">Rope divider</title>
<style>
.cb{animation:slide 8s ease-in-out infinite}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(780px)}}
.ea{animation:pulse 8s ease-in-out infinite}.eb{animation:pulse 8s ease-in-out infinite;animation-delay:-4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1.5)}25%,75%{opacity:.35;transform:scale(1)}}
.ea,.eb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cb{transform:translateX(390px)}}
</style>
<path d="M30,18 Q430,22 830,18" fill="none" stroke="#8aa0bf" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
<circle class="ea" cx="30" cy="18" r="3.5" fill="#2dd4bf"/><circle class="eb" cx="830" cy="18" r="3.5" fill="#2dd4bf"/>
<g class="cb"><g transform="translate(30,18)"><rect x="-6" y="-9" width="12" height="18" rx="6" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M-6,-2 L6,-5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/></g></g>
</svg>
