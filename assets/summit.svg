<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.sans{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.dA{animation:dA 18s linear infinite}.dB{animation:dB 18s linear infinite}
