<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">Let's rope up</title>
<desc id="d">Sunrise at the summit above a sea of clouds: two climbers sit side by side with their dog, a flag waves, and the words Let's rope up appear in amber.</desc>
<defs>
