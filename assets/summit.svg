.bw{transform-box:fill-box;transform-origin:center;animation:fl .32s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.bz .bw{animation:br 4s ease-in-out infinite alternate}
@keyframes br{from{transform:scaleX(.3)}to{transform:scaleX(.45)}}
.big{font-weight:700;font-size:80px;fill:#f59e0b}
