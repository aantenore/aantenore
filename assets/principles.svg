.cT{transform:translate(23px,385px);animation:trav 18s ease-in-out infinite}
.ttl{font-weight:700;font-size:30px;fill:#e6edf3;paint-order:stroke;stroke:#0b1d3a;stroke-width:5px;stroke-linejoin:round}
.limb{transform-box:view-box;transform-origin:0 0}
.a{animation:swA 1.1s ease-in-out infinite}.b{animation:swB 1.1s ease-in-out infinite}
@keyframes swA{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes swB{from{transform:rotate(12deg)}to{transform:rotate(-10deg)}}
.bob{animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
.rope{transform-box:view-box;transform-origin:868px 0;animation:rs 9s ease-in-out infinite alternate}
@keyframes rs{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.spark{opacity:0;transform-box:view-box;transform-origin:0 0;animation:spk 18s ease-out infinite}
@keyframes spk{0%,82%{opacity:0;transform:scale(0)}85%{opacity:1;transform:scale(1.3) rotate(30deg)}92%{opacity:.8;transform:scale(1) rotate(60deg)}96%,100%{opacity:0;transform:scale(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:1}.cT{transform:translate(753px,385px)}.lit{opacity:1}.spark{opacity:.9;transform:scale(1)}}</style>
<pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".8" fill="#fff" fill-opacity=".04"/><circle cx="14" cy="2" r=".6" fill="#fff" fill-opacity=".03"/><circle cx="20" cy="11" r=".9" fill="#fff" fill-opacity=".035"/><circle cx="8" cy="15" r=".6" fill="#fff" fill-opacity=".04"/><circle cx="17" cy="21" r=".7" fill="#fff" fill-opacity=".03"/><circle cx="1" cy="22" r=".5" fill="#fff" fill-opacity=".035"/></pattern><radialGradient id="vg" cx=".5" cy=".5" r=".78"><stop offset=".55" stop-color="#0b1d3a" stop-opacity="0"/><stop offset="1" stop-color="#0b1d3a" stop-opacity=".42"/></radialGradient>
