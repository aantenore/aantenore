<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d">
<title id="t">Engineering principles</title>
<desc id="d">A rock wall with chalk marks and a hanging rope. One climber traverses left to right and five large holds light up in sequence, each with its own icon: configurable (sliders), contracts (braces), local-first (house), evidence (check mark) and useful (heart). At the end all five stay lit and the climber hangs at the last hold with a small spark.</desc>
<defs>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".85"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="ch"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="hz2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".15"/></linearGradient>
<linearGradient id="wf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3b66"/><stop offset="1" stop-color="#10294d"/></linearGradient>
<pattern id="rock" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="2" fill="#0b1d3a" opacity=".5"/><circle cx="31" cy="22" r="3" fill="#0b1d3a" opacity=".4"/><circle cx="18" cy="38" r="1.5" fill="#fff" opacity=".1"/><path d="M36,4 L42,12 M4,28 L12,26" stroke="#0b1d3a" stroke-width="1.5" opacity=".5"/></pattern>
