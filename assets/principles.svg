@keyframes q0{0%,9%{opacity:0}10%,95%{opacity:1}98%,100%{opacity:0}}.q0{animation:q0 18s linear infinite}@keyframes q1{0%,27%{opacity:0}28%,95%{opacity:1}98%,100%{opacity:0}}.q1{animation:q1 18s linear infinite}@keyframes q2{0%,45%{opacity:0}46%,95%{opacity:1}98%,100%{opacity:0}}.q2{animation:q2 18s linear infinite}@keyframes q3{0%,63%{opacity:0}64%,95%{opacity:1}98%,100%{opacity:0}}.q3{animation:q3 18s linear infinite}@keyframes q4{0%,81%{opacity:0}82%,95%{opacity:1}98%,100%{opacity:0}}.q4{animation:q4 18s linear infinite}
.fade{animation:fade 18s linear infinite}
