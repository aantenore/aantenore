<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 36" width="860" height="36" role="img" aria-labelledby="t">
<title id="t">Altitude marker: 1,900 m · approx.</title>
<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.lb{font-size:12px;fill:#8aa0bf}
.cb{animation:slide 8s ease-in-out infinite}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(640px)}}
.ea,.eb{transform-box:fill-box;transform-origin:center;animation:pulse 8s ease-in-out infinite}.eb{animation-delay:-4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1.5)}25%,75%{opacity:.35;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cb{transform:translateX(320px)}}
</style>
<text class="lb mono" x="8" y="22">1,900 m · approx.</text>
<path d="M190,18 Q510,22 830,18" fill="none" stroke="#8aa0bf" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
<circle class="ea" cx="190" cy="18" r="3.5" fill="#2dd4bf"/><circle class="eb" cx="830" cy="18" r="3.5" fill="#2dd4bf"/>
<g class="cb"><g transform="translate(190,18)"><rect x="-6" y="-9" width="12" height="18" rx="6" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M-6,-2 L6,-5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/></g></g>
</svg>
