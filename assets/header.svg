<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Antonio Antenore, AI engineer and software architect</title>
<desc id="d">Hero banner at midnight base camp: a slow aurora and twinkling stars over three drifting mountain ridges, a climber checking gear by headlamp, a butterfly asleep on a rock, the name Antonio Antenore, AI engineer and software architect in Turin, and three chips: agentic AI, local LLMs, distributed systems.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d3a"/><stop offset="1" stop-color="#10294d"/></linearGradient>
<linearGradient id="aur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".4"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
<linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8aa0bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".25"/><stop offset="1" stop-color="#e6edf3" stop-opacity="0"/></linearGradient>
<linearGradient id="lamp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e6edf3" stop-opacity=".7"/><stop offset="1" stop-color="#e6edf3" stop-opacity="0"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#f59e0b" stop-opacity="1"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
<mask id="nm"><text class="name sans" x="450" y="152" text-anchor="middle" textLength="800" lengthAdjust="spacingAndGlyphs" style="fill:#fff">Antonio Antenore</text></mask>
<clipPath id="fr"><rect width="900" height="420" rx="14"/></clipPath>
<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.sans{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.dA{animation:dA 18s linear infinite}.dB{animation:dB 18s linear infinite}
@keyframes dA{to{transform:translateX(-300px)}}@keyframes dB{to{transform:translateX(-450px)}}
.cl{fill:#8aa0bf;opacity:.16}
.cl>g{animation:cdrift 60s linear infinite}
.c1>g{animation-duration:84s;animation-delay:-30s}.c2>g{animation-duration:110s;animation-delay:-70s}.c0>g{animation-delay:-12s}
@keyframes cdrift{from{transform:translateX(-120px)}to{transform:translateX(1020px)}}
.st{animation:tw 4s ease-in-out infinite}.s1{animation-delay:-1.3s}.s2{animation-delay:-2.6s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.bf{animation:fly 16s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(110px,-26px)}50%{transform:translate(220px,6px)}75%{transform:translate(110px,34px)}}
.bw{transform-box:fill-box;transform-origin:center;animation:fl .32s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.bz .bw{animation:br 4s ease-in-out infinite alternate}
@keyframes br{from{transform:scaleX(.3)}to{transform:scaleX(.45)}}

.hz{animation:hz 18s ease-in-out infinite}@keyframes hz{0%{opacity:.9}25%,65%{opacity:0}90%{opacity:1}100%{opacity:.9}}
.stars{animation:stars 18s ease-in-out infinite}@keyframes stars{0%{opacity:.25}20%,70%{opacity:1}90%,100%{opacity:.25}}
.au{animation:au 18s ease-in-out infinite}@keyframes au{0%,8%{opacity:0}25%,65%{opacity:1}85%,100%{opacity:0}}
.au>path{transform-origin:0 200px;animation:aw 9s ease-in-out infinite alternate}
@keyframes aw{from{transform:translateX(-70px) scaleY(.9)}to{transform:translateX(70px) scaleY(1.15)}}
.sun{opacity:0;animation:sunr 18s ease-in-out infinite}@keyframes sunr{0%,60%{opacity:0}88%{opacity:1}96%,100%{opacity:0}}
.lamp{opacity:0;animation:lamp 18s ease-in-out infinite}@keyframes lamp{0%,14%{opacity:0}24%,68%{opacity:.9}80%,100%{opacity:0}}
.pf{opacity:0;transform-box:view-box;transform-origin:0 0;animation:pf 2.6s ease-out infinite}.p2{animation-delay:-1.3s}
@keyframes pf{0%{opacity:.5;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(16px,-16px) scale(1.8)}}
.sn{animation:fall var(--d) linear infinite;animation-delay:var(--l)}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(var(--x),700px)}}
.shoot{opacity:0;animation:shoot 18s ease-in infinite}
@keyframes shoot{0%,34%{opacity:0;transform:translate(0,0)}35%{opacity:1}39%{opacity:0;transform:translate(300px,135px)}100%{opacity:0}}
.bd{opacity:0;animation:bd1 18s linear infinite}.bd2{animation-name:bd2}
@keyframes bd1{0%,2%{opacity:0;transform:translate(-60px,0)}3%{opacity:.8}17%{opacity:.8}18%,100%{opacity:0;transform:translate(960px,-40px)}}
@keyframes bd2{0%,80%{opacity:0;transform:translate(960px,0)}81%{opacity:.8}96%{opacity:.8}97%,100%{opacity:0;transform:translate(-60px,30px)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
.dC{animation:dC 18s linear infinite}@keyframes dC{to{transform:translateX(-600px)}}

.name{font-weight:700;font-size:88px;fill:#e6edf3}
.sub{font-size:30px;fill:#8aa0bf}
.bc{font-size:26px;font-weight:700;fill:#f59e0b;letter-spacing:1px}
.chip{font-size:26px;font-weight:600;fill:#e6edf3}
.sweep{animation:sw 9s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-220px)}45%,100%{transform:translateX(1000px)}}
.sp{transform-box:view-box;transform-origin:0 0;animation:spk 9s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(0)}40%,60%{opacity:.9;transform:scale(1)}}
.cH{transform:translate(118px,280px)}
.lamp{animation:none;opacity:.9}
.limb{transform-box:view-box;transform-origin:0 0}
.a{animation:swA 2.4s ease-in-out infinite}.b{animation:swB 2.4s ease-in-out infinite}
@keyframes swA{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes swB{from{transform:rotate(10deg)}to{transform:rotate(-8deg)}}
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.4px)}}
.tail{transform-box:view-box;transform-origin:0 0;animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.sp{opacity:.7;transform:scale(1)}.sweep{display:none}.au{opacity:.6}.stars{opacity:1}}</style>
<pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".8" fill="#fff" fill-opacity=".04"/><circle cx="14" cy="2" r=".6" fill="#fff" fill-opacity=".03"/><circle cx="20" cy="11" r=".9" fill="#fff" fill-opacity=".035"/><circle cx="8" cy="15" r=".6" fill="#fff" fill-opacity=".04"/><circle cx="17" cy="21" r=".7" fill="#fff" fill-opacity=".03"/><circle cx="1" cy="22" r=".5" fill="#fff" fill-opacity=".035"/></pattern><radialGradient id="vg" cx=".5" cy=".5" r=".78"><stop offset=".55" stop-color="#0b1d3a" stop-opacity="0"/><stop offset="1" stop-color="#0b1d3a" stop-opacity=".42"/></radialGradient></defs>
