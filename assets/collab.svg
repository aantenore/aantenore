<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Looking for rope partners</title>
<desc id="d">Two clusters of carabiner-shaped tags. Clip in: interesting problems, half-baked ideas, brainstorming, strong opinions on local versus cloud models. Leave at the base: synergies, meetings that could be an issue, rewriting it in whatever is trending, quick calls about what a README says. Between them a roped pair waits while a dashed third climber, the reader, steps onto the rope and becomes solid.</desc>
