<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">Topo: things I have fallen off, documented</title>
<desc id="d">A blueprint-style climbing topo of four open-source projects drawn as routes: reinloop, lorebase, agent-layers and agent-plexus, plus a dashed fifth route inviting your project to rope up. The route lines draw themselves one after another.</desc>
<defs>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30,0 H0 V30" fill="none" stroke="#1f3b66" stroke-opacity=".6" stroke-width="1"/></pattern>
<clipPath id="fr"><rect width="900" height="380" rx="14"/></clipPath>
<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.sans{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.dA{animation:dA 18s linear infinite}.dB{animation:dB 18s linear infinite}
@keyframes dA{to{transform:translateX(-300px)}}@keyframes dB{to{transform:translateX(-450px)}}
.cl{fill:#8aa0bf;opacity:.16}
.cl>g{animation:cdrift 60s linear infinite}
.c1>g{animation-duration:84s;animation-delay:-30s}.c2>g{animation-duration:110s;animation-delay:-70s}.c0>g{animation-delay:-12s}
@keyframes cdrift{from{transform:translateX(-120px)}to{transform:translateX(1020px)}}
.st{animation:tw 4s ease-in-out infinite}.s1{animation-delay:-1.3s}.s2{animation-delay:-2.6s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.ttl{font-size:20px;font-weight:700;fill:#e6edf3}
.nm{font-size:13px;font-weight:700;fill:#f59e0b}
.ds{font-size:12px;fill:#e6edf3}
.num{font-size:14px;font-weight:700;fill:#f59e0b}
.foot{font-size:12px;fill:#8aa0bf}
.nd{transform-origin:845px 64px;animation:nd 3.5s ease-in-out infinite alternate}
@keyframes nd{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes d0{0%,3%{stroke-dashoffset:100;opacity:1}14%,92%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes f0{0%,12%{opacity:0}17%,92%{opacity:1}96%,100%{opacity:0}}@keyframes d1{0%,16%{stroke-dashoffset:100;opacity:1}27%,92%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes f1{0%,25%{opacity:0}30%,92%{opacity:1}96%,100%{opacity:0}}@keyframes d2{0%,29%{stroke-dashoffset:100;opacity:1}40%,92%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes f2{0%,38%{opacity:0}43%,92%{opacity:1}96%,100%{opacity:0}}@keyframes d3{0%,42%{stroke-dashoffset:100;opacity:1}53%,92%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes f3{0%,51%{opacity:0}56%,92%{opacity:1}96%,100%{opacity:0}}@keyframes d4{0%,56%{opacity:0}67%,92%{opacity:1}96%,100%{opacity:0}}@keyframes f4{0%,65%{opacity:0}70%,92%{opacity:1}96%,100%{opacity:0}}.d0{stroke-dashoffset:100;animation:d0 14s ease-in-out infinite}.f0{opacity:0;animation:f0 14s ease-in-out infinite}.d1{stroke-dashoffset:100;animation:d1 14s ease-in-out infinite}.f1{opacity:0;animation:f1 14s ease-in-out infinite}.d2{stroke-dashoffset:100;animation:d2 14s ease-in-out infinite}.f2{opacity:0;animation:f2 14s ease-in-out infinite}.d3{stroke-dashoffset:100;animation:d3 14s ease-in-out infinite}.f3{opacity:0;animation:f3 14s ease-in-out infinite}.d4{opacity:0;animation:d4 14s ease-in-out infinite}.f4{opacity:0;animation:f4 14s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
*{animation:none!important}
.d0,.d1,.d2,.d3{stroke-dashoffset:0}.d4{opacity:1}
.f0,.f1,.f2,.f3,.f4{opacity:1}
}</style>
</defs>
