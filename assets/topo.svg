<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
<title id="t">Topo: things I have fallen off, documented</title>
<desc id="d">A blueprint-style climbing topo of five routes: the prototype, the rewrite, the migration, the quick fix, and a dashed fifth route inviting your project to rope up. The route lines draw themselves one after another.</desc>
<defs>
